<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI — Multi-Agent Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="6" fill="#00f2fe"/>
                    <text x="7" y="20" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#0f0f13">N</text>
                </svg>
                <span class="logo-text">Nexus AI</span>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="sidebar-section">
            <h3 class="sidebar-label">Status</h3>
            <div class="status-card" id="status-card">
                <div class="status-dot"></div>
                <span id="connection-status">Connecting...</span>
            </div>
        </div>

        <div class="sidebar-section">
            <h3 class="sidebar-label">Agents</h3>
            <ul class="agent-list" id="agent-list">
                <!-- Populated via JS -->
            </ul>
        </div>

        <div class="sidebar-section">
            <h3 class="sidebar-label">Activity</h3>
            <div class="activity-log" id="activity-log">
                <!-- Populated via JS -->
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="info-row">
                <span class="info-label">Provider</span>
                <span class="info-value" id="provider-info">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Model</span>
                <span class="info-value" id="model-info">—</span>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-area" id="chat-area">
        <header class="chat-header">
            <button class="menu-btn" id="menu-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="chat-title">
                <h2>Chat</h2>
                <span class="chat-subtitle" id="chat-subtitle">Multi-Agent Collaboration</span>
            </div>
            <button class="clear-btn" id="clear-btn" title="Clear chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/><path d="m19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
            </button>
        </header>

        <div class="messages" id="messages">
            <!-- Welcome message -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-logo">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="#00f2fe"/>
                        <text x="12" y="34" font-family="JetBrains Mono" font-size="28" font-weight="700" fill="#0f0f13">N</text>
                    </svg>
                </div>
                <h1 class="welcome-title">Nexus AI</h1>
                <p class="welcome-sub">Multi-Agent AI Development Platform</p>
                <div class="suggestions">
                    <button class="suggestion" onclick="sendSuggestion('Build a REST API for a blog with CRUD operations')">
                        <span class="suggestion-icon">&#x2692;</span>
                        Build a REST API
                    </button>
                    <button class="suggestion" onclick="sendSuggestion('Design the architecture for a real-time chat application')">
                        <span class="suggestion-icon">&#x1F4D0;</span>
                        Design chat architecture
                    </button>
                    <button class="suggestion" onclick="sendSuggestion('Debug and fix the authentication flow')">
                        <span class="suggestion-icon">&#x1F41B;</span>
                        Debug auth flow
                    </button>
                    <button class="suggestion" onclick="sendSuggestion('Write comprehensive tests for the user service')">
                        <span class="suggestion-icon">&#x2705;</span>
                        Write test suite
                    </button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="chat-input" placeholder="Send a message to the team..." rows="1" autofocus></textarea>
                <button class="send-btn" id="send-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">
                Press <kbd>Enter</kbd> to send, <kbd>Shift+Enter</kbd> for new line
            </div>
        </div>
    </main>

    <script src="/static/chat.js"></script>
</body>
</html>
