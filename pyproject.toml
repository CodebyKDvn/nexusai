[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "Multi-agent AI development platform — an autonomous AI Dev Team"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nexus AI Team" },
]
keywords = ["ai", "agents", "coding", "llm", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "rich>=13.7",
    "click>=8.1",
    "openai>=1.30",
    "anthropic>=0.25",
    "chromadb>=0.5",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "textual>=0.80",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "tiktoken.*", "textual.*", "prompt_toolkit.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
